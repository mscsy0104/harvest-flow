[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-flow-my"
version = "0.1.0"
description = "Private personal instance for HarvestFlow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harvest-flow[dashboard]>=0.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.8.0", "pytest>=8.3.0"]

