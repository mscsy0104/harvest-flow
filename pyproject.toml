[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-flow"
version = "0.1.0"
description = "HarvestFlow core and reference app for note workflow automation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HarvestFlow Contributors" }]
dependencies = [
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "requests>=2.32.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.58.0"]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[project.urls]
Homepage = "https://github.com/harvest-flow/harvest-flow"
Repository = "https://github.com/harvest-flow/harvest-flow"

[project.scripts]
harvest-flow-engine = "harvest_flow.cli:engine_main"
harvest-flow-dashboard = "harvest_flow.cli:dashboard_main"

[tool.setuptools]
py-modules = ["app", "dashboard"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harvest_flow*", "src*", "config*"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["RUF100"]
