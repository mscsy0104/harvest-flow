name: python-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: |
          uv run ruff check harvest_flow tests
          uv run ruff format --check harvest_flow tests

      - name: Tests
        run: uv run python -m pytest

      - name: Integration smoke (core boundary adapters)
        run: |
          uv run python -c "from harvest_flow.adapters.vector_db import QdrantVectorAdapter; from harvest_flow.adapters.metadata_db import SqliteMetadataAdapter; from harvest_flow.adapters.ssg import GitHubSSGAdapter; print('adapter-smoke-ok')"
          uv run python -c "import app; print('app-import-smoke-ok')"

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose --env-file .env.example -f docker-compose.yml config -q

